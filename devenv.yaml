---
# Public inputs only: a fresh clone enters the shell with no SSH key and no
# access to private infrastructure. The Rust toolchain and the ci:* tasks
# that came from a shared module set are in devenv.nix.
inputs:
  nixpkgs:
    url: github:NixOS/nixpkgs/nixpkgs-unstable
  # languages.rust's toolchain (devenv reads it from this input name).
  rust-overlay:
    url: github:oxalica/rust-overlay
    inputs:
      nixpkgs:
        follows: nixpkgs
