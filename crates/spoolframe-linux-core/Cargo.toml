[package]
name = "spoolframe-linux-core"
description = "The GTK-free part of Spoolframe Linux: themes, and the backend the UI reads from."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
spoolframe-policy = { workspace = true, optional = true }
spoolframe-types = { workspace = true }
spoolframe-protocol = { workspace = true }
spoolframe-client-sdk = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
oo7 = { workspace = true }
foyer = { workspace = true }
anyhow = { workspace = true }
directories = { workspace = true }
tempfile = { workspace = true }
webauthn-authenticator-rs = { workspace = true }
webauthn-rs-proto = { workspace = true }
serde_cbor_2 = { workspace = true }
futures = { workspace = true }
url = "2"
spoolframe-test-dir = { workspace = true, optional = true }

[features]
# TestDir and the fake server, for the app's tests too.
testing = ["dep:spoolframe-test-dir", "dep:spoolframe-policy"]

[dev-dependencies]
spoolframe-policy = { workspace = true }
spoolframe-test-dir = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "time"] }
