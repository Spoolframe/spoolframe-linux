# `cargo deny --locked check` in full (ci:static, through
# spoolframe-linux:deny): advisories, bans, licenses and sources, with no
# warning left. Every exception names a crate in the client's graph: one
# waiting for a crate that is not there is a warning.
[graph]
all-features = true
exclude-dev = true

# The client is GPL; AGPL dependencies are deliberately excluded.
[licenses]
confidence-threshold = 0.95
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC",
  "Unicode-3.0", "Zlib", "CC0-1.0", "Unlicense", "BSL-1.0",
  "CDLA-Permissive-2.0", "LGPL-2.1-or-later", "MPL-2.0",
]
exceptions = [
  { crate = "spoolframe-policy", allow = ["GPL-3.0-or-later"] },
  { crate = "spoolframe-linux-core", allow = ["GPL-3.0-or-later"] },
  { crate = "spoolframe-linux-app", allow = ["GPL-3.0-or-later"] },
]

# Accepted advisories (PX-11), so `cargo deny --locked check advisories`
# passes and a new one stands out. .cargo/audit.toml (cargo audit, daily in
# .forgejo/workflows/audit.yaml) accepts the same ones: keep the two lists
# the same.
[advisories]
ignore = [
  # paste: unmaintained, not vulnerable. A proc-macro run at build time
  # (through foyer and iroh's netlink-packet-core); none of it is in the
  # binary.
  { id = "RUSTSEC-2024-0436", reason = "paste is an unmaintained build-time proc-macro; no code of it runs in the client" },
  # crypto-bigint 0.5: constant-time operations could branch on secrets,
  # fixed only in 0.7.6. It comes through elliptic-curve 0.13, from our
  # vendored crypto-glue 0.1.15 under webauthn-rs, where caBLE's P-256
  # ECDH uses secret keys (the SDK is on p256 0.14 since 0.15.1).
  # Accepted until webauthn-rs moves to crypto-glue 0.2; then this goes.
  { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5 through elliptic-curve 0.13 from vendored crypto-glue 0.1 (webauthn caBLE ECDH); accepted until webauthn-rs moves to crypto-glue 0.2" },
  # zstd 0.13.3 and zstd-safe 7.3.0 (dated 2026-10-16): stream, dictionary,
  # context-clone, Seekable and legacy-frame memory bugs, fixed only in
  # zstd 0.14.3 and zstd-safe 8.2.0. They come through foyer-storage 0.22.6
  # (artwork's disk cache), whose newest release and main branch need zstd
  # 0.13 with no feature to drop it. foyer's compression is off here (its
  # default, Compression::None), so entries are written without zstd; only
  # an entry whose header says zstd, in the client's own cache files, would
  # reach the decoder. Accepted until foyer moves to zstd 0.14; then these go.
  { id = "RUSTSEC-2026-0391", reason = "zstd 0.13 / zstd-safe 7 through foyer-storage 0.22, which needs zstd 0.13; its compression is off here, so no zstd code runs on entries the client wrote" },
  { id = "RUSTSEC-2026-0395", reason = "zstd 0.13 / zstd-safe 7 through foyer-storage 0.22, which needs zstd 0.13; its compression is off here, so no zstd code runs on entries the client wrote" },
  { id = "RUSTSEC-2026-0396", reason = "zstd 0.13 / zstd-safe 7 through foyer-storage 0.22, which needs zstd 0.13; its compression is off here, so no zstd code runs on entries the client wrote" },
  { id = "RUSTSEC-2026-0397", reason = "zstd 0.13 / zstd-safe 7 through foyer-storage 0.22, which needs zstd 0.13; its compression is off here, so no zstd code runs on entries the client wrote" },
  { id = "RUSTSEC-2026-0398", reason = "zstd 0.13 / zstd-safe 7 through foyer-storage 0.22, which needs zstd 0.13; its compression is off here, so no zstd code runs on entries the client wrote" },
  { id = "RUSTSEC-2026-0399", reason = "zstd 0.13 / zstd-safe 7 through foyer-storage 0.22, which needs zstd 0.13; its compression is off here, so no zstd code runs on entries the client wrote" },
  { id = "RUSTSEC-2026-0400", reason = "zstd 0.13 / zstd-safe 7 through foyer-storage 0.22, which needs zstd 0.13; its compression is off here, so no zstd code runs on entries the client wrote" },
  { id = "RUSTSEC-2026-0401", reason = "zstd 0.13 / zstd-safe 7 through foyer-storage 0.22, which needs zstd 0.13; its compression is off here, so no zstd code runs on entries the client wrote" },
  { id = "RUSTSEC-2026-0402", reason = "zstd 0.13 / zstd-safe 7 through foyer-storage 0.22, which needs zstd 0.13; its compression is off here, so no zstd code runs on entries the client wrote" },
  { id = "RUSTSEC-2026-0403", reason = "zstd 0.13 / zstd-safe 7 through foyer-storage 0.22, which needs zstd 0.13; its compression is off here, so no zstd code runs on entries the client wrote" },
  { id = "RUSTSEC-2026-0404", reason = "zstd 0.13 / zstd-safe 7 through foyer-storage 0.22, which needs zstd 0.13; its compression is off here, so no zstd code runs on entries the client wrote" },
  { id = "RUSTSEC-2026-0405", reason = "zstd 0.13 / zstd-safe 7 through foyer-storage 0.22, which needs zstd 0.13; its compression is off here, so no zstd code runs on entries the client wrote" },
  { id = "RUSTSEC-2026-0406", reason = "zstd 0.13 / zstd-safe 7 through foyer-storage 0.22, which needs zstd 0.13; its compression is off here, so no zstd code runs on entries the client wrote" },
]

# Several versions of one crate come from upstream (iroh, webauthn-rs's
# crypto, the HTTP and TLS stacks, gtk-rs and the windows crates pinning
# different majors), not from a choice made here: a warning for each would
# bury a real finding. `cargo tree -d` lists them.
[bans]
multiple-versions = "allow"

# crates.io, the SDK crates' too. The one git source is noq-proto's fix for
# playback on a lossy link (PX-62, Cargo.toml's [patch.crates-io]).
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = [
  "https://github.com/rust-lang/crates.io-index",
]
allow-git = [
  "https://github.com/n0-computer/noq",
]
