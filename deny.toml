# `cargo deny --locked check` in full (ci:static, through
# spoolframe-linux:deny): advisories, bans, licenses and sources, with no
# warning left. Every exception names a crate in the client's graph: one
# waiting for a crate that is not there is a warning.
[graph]
all-features = true
exclude-dev = true

# The client is GPL; AGPL dependencies are deliberately excluded.
[licenses]
confidence-threshold = 0.95
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC",
  "Unicode-3.0", "Zlib", "CC0-1.0", "Unlicense", "BSL-1.0",
  "CDLA-Permissive-2.0", "LGPL-2.1-or-later", "MPL-2.0",
]
exceptions = [
  { crate = "spoolframe-policy", allow = ["GPL-3.0-or-later"] },
  { crate = "spoolframe-linux-core", allow = ["GPL-3.0-or-later"] },
  { crate = "spoolframe-linux-app", allow = ["GPL-3.0-or-later"] },
]

# Accepted advisories (PX-11), so `cargo deny --locked check advisories`
# passes and a new one stands out. .cargo/audit.toml (cargo audit, daily in
# .forgejo/workflows/audit.yaml) accepts the same ones: keep the two lists
# the same.
[advisories]
ignore = [
  # paste: unmaintained, not vulnerable. A proc-macro run at build time
  # (through foyer and iroh's netlink-packet-core); none of it is in the
  # binary.
  { id = "RUSTSEC-2024-0436", reason = "paste is an unmaintained build-time proc-macro; no code of it runs in the client" },
  # zvariant, zbus_names and zvariant_derive: unmaintained, not vulnerable.
  # zbus 6.0 took them in, as its wire and names modules and its derive
  # macros. They come in through zbus 5, which oo7 0.6 (the keyring),
  # ashpd 0.13 (oo7's portal) and mpris-server 0.10 (media keys) use; no
  # release of the three is on zbus 6 yet (oo7 0.7 is a beta, on zbus
  # 5.19). Drop these when they move.
  { id = "RUSTSEC-2026-0370", reason = "zvariant is zbus 5's wire format, through oo7, ashpd and mpris-server; none has a zbus 6 release" },
  { id = "RUSTSEC-2026-0371", reason = "zbus_names is zbus 5's name types, through oo7, ashpd and mpris-server; none has a zbus 6 release" },
  { id = "RUSTSEC-2026-0372", reason = "zvariant_derive is zbus 5's build-time derive macros, through oo7, ashpd and mpris-server; none has a zbus 6 release" },
]

# Several versions of one crate come from upstream (iroh, webauthn-rs's
# crypto, the HTTP and TLS stacks, gtk-rs and the windows crates pinning
# different majors), not from a choice made here: a warning for each would
# bury a real finding. `cargo tree -d` lists them.
[bans]
multiple-versions = "allow"

# crates.io, and the Coldsteel registry the SDK crates come from
# (.cargo/config.toml). No git sources.
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = [
  "https://github.com/rust-lang/crates.io-index",
  "sparse+https://cargo.coldsteel.casa/api/v1/crates/",
]
