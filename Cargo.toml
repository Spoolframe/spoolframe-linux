[workspace]
resolver = "2"
members = [
    "crates/spoolframe-linux-core",
    "crates/spoolframe-linux-app",
]
# The patched webauthn crates (vendor/VENDORED.md) are path dependencies,
# not members: cargo fmt, clippy and test leave them as upstream wrote them.
exclude = ["vendor"]

[workspace.package]
version = "0.6.1"
edition = "2024"
authors = ["Andrey Cherkashin <andoriyu@gmail.com>"]
# GPL, not the server's AGPL nor the protocol crates' MIT/Apache: the client
# is free software that stays free, and it links only the permissive
# spoolframe crates (ARCHITECTURE §56).
license = "GPL-3.0-or-later"
repository = "https://git.coldsteel.casa/Spoolframe/spoolframe-linux"

[workspace.dependencies]
# The app's global allocator, the one mainframe and the server use. Built
# with the `cc` crate rather than its default cmake: the devshell carries
# no cmake, and `cc` needs only its C++ compiler. `check`: snmalloc's
# hardening checks. GTK and GStreamer allocate through glib's own malloc,
# so this covers the Rust side only.
snmalloc-rs = { version = "0.7.5", default-features = false, features = ["build_cc", "check"] }

# Internal crates
spoolframe-linux-core = { path = "crates/spoolframe-linux-core" }

# The client-facing media model. The permissive spoolframe crates come from
# the Coldsteel cargo registry (named in .cargo/config.toml), where
# Spoolframe/spoolframe-server publishes them; reads are anonymous. The
# five move together: one version for all of them, the server's release.
spoolframe-types = { version = "0.15.0", registry = "coldsteel" }
# The client protocol's types (home screen, playback plans and handles,
# artwork sizes), which the SDK returns too.
spoolframe-protocol = { version = "0.15.0", registry = "coldsteel" }
# The client side of the protocol: Iroh transport, saved servers, sessions.
spoolframe-client-sdk = { version = "0.15.0", registry = "coldsteel", features = ["media-readers"] }
spoolframe-policy = { version = "0.15.0", registry = "coldsteel" }
# The SDK's Storage trait is an async-trait one.
async-trait = "0.1"

# UI: Relm4 over GTK 4 and libadwaita. v1_6 is the first libadwaita with
# the CSS colour variables and the system accent colour that theming is
# built on.
relm4 = { version = "0.11", features = ["libadwaita"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_6"] }
gtk = { package = "gtk4", version = "0.11", features = ["v4_16"] }
# v1_56: a font file added to the font map, for the wordmark's face.
pango = { version = "0.22", features = ["v1_56"] }
# An image's size from its header alone, so the server's artwork is
# measured before it is decoded (PX-11, C-14). gdk-pixbuf's loader cannot
# do it: once it knows the size, it makes room for the whole image.
imagesize = "0.15"

# Player: GstPlay drives playbin3. gtk4paintablesink is linked in rather
# than loaded as a system plugin, so that it uses the app's own GTK: a
# plugin built against another copy of GTK would load a second one.
gst = { package = "gstreamer", version = "0.25" }
# v1_26: tracks chosen by stream ID; the index calls fail under playbin3.
gst-play = { package = "gstreamer-play", version = "0.25", features = ["v1_26"] }
# The spoolframe:// source element is a BaseSrc subclass.
gst-base = { package = "gstreamer-base", version = "0.25" }
# dmabuf: decoded frames reach GTK in GPU memory; wayland/x11egl give
# the sink a GL context. Without them every frame is copied out of the
# decoder and converted on the CPU, which 4K cannot keep up with.
gst-plugin-gtk4 = { version = "0.15", features = ["gtk_v4_20", "dmabuf", "wayland", "x11egl"] }
# QR codes for a phone to scan (P3-05's sign-in with your phone); the
# encoder only, the app draws the modules itself.
qrcode = { version = "0.14", default-features = false }
# A test's own directory under a random name, removed with it, so tests
# running at once never share one (core's `testing` feature).
spoolframe-test-dir = { version = "0.15.0", registry = "coldsteel" }
# The play queue saved per profile (P1-23), as JSON beside the SDK's data.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Compiles the app's icons into its binary (a GResource).
glib-build-tools = "0.22"

# The backend's connection state is a tokio watch channel, as in the SDK.
# Relm4 runs its commands on tokio already. `macros`: join! for calls
# that do not wait on each other.
# 0.6: pure-Rust crypto (crypto-glue), no OpenSSL. A prerelease, chosen
# for that and for its phone (caBLE) support; see the passkey commits.
# `cable`, the phone flow, brings OpenSSL back: its websocket uses
# tokio-tungstenite with native-tls, which the crate fixes (accepted).
# No `rsa` (default-features = false): the crates come patched from vendor/
# ([patch.crates-io] below), so the rsa crate (RUSTSEC-2023-0071, no fixed
# release) is not built at all. The client never needs RSA: it checks no
# key's signature or attestation, it passes them to the server, which
# verifies them; an RS256 passkey still works. Only the library's own
# RS256 checks, which the client does not call, now fail as unsupported.
webauthn-authenticator-rs = { version = "=0.6.1-dev", default-features = false, features = ["usb", "cable"] }
webauthn-rs-proto = "=0.6.1-dev"
# Reads the passkey's id out of a key's attestation object: the library
# leaves it empty for CTAP2 keys.
serde_cbor_2 = "0.13"
# Wraps each security key the library finds (passkey::Discoverable).
futures = "0.3"
tokio = { version = "1", features = ["sync", "rt-multi-thread", "macros"] }

# Where config, data and cache live, by each platform's rules.
directories = "6"
# A private temporary directory where the platform has no runtime one.
tempfile = "3"

# The app confined at start (C-15): Landlock for files, seccomp for
# calls, as the server confines its media tools.
landlock = "0.4"
seccompiler = "0.5"
libc = "0.2"
# The SDK's TLS provider (iroh's aws-lc-rs), which `--self-check` runs
# confined: its random numbers and a key exchange.
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std"] }

# Secrets (the device key, session tokens) in the desktop's Secret
# Service, never a plain file; in a Flatpak, in a file of the app's own
# whose key the Secret portal keeps. Through libsecret (GNOME's library,
# in the GNOME runtime), not oo7: oo7 0.6 is on zbus 5, whose zvariant,
# zbus_names and zvariant_derive are unmaintained (RUSTSEC-2026-0370 to
# 0372). v0_19: binary secrets, and a search that tells items apart.
libsecret = { version = "0.9", features = ["v0_19"] }
# GTK's GLib and GIO, for libsecret's errors and cancellables.
glib = "0.22"
gio = "0.22"

# Artwork kept on this device, in memory and on disk.
foyer = "0.22"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
thiserror = "2"
anyhow = "1"

# The webauthn-rs crates with rsa made optional, from vendor/ (VENDORED.md
# there says what changed). Same versions as crates.io, so the pinned
# =0.6.1-dev resolves to them. Drop the four when crypto-glue and
# webauthn-rs release an optional rsa.
[patch.crates-io]
crypto-glue = { path = "vendor/crypto-glue" }
webauthn-attestation-ca = { path = "vendor/webauthn-attestation-ca" }
webauthn-authenticator-rs = { path = "vendor/webauthn-authenticator-rs" }
webauthn-rs-core = { path = "vendor/webauthn-rs-core" }
