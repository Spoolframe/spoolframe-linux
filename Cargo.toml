[workspace]
resolver = "2"
members = [
    "crates/spoolframe-linux-core",
    "crates/spoolframe-linux-app",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Andrey Cherkashin <andoriyu@gmail.com>"]
# GPL, not the server's AGPL nor the protocol crates' MIT/Apache: the client
# is free software that stays free, and it links only the permissive
# spoolframe crates (ARCHITECTURE §56).
license = "GPL-3.0-or-later"
repository = "https://git.coldsteel.casa/Coldsteel/foundry"

[workspace.dependencies]
# The app's global allocator, the one mainframe and the server use. Built
# with the `cc` crate rather than its default cmake: the devshell carries
# no cmake, and `cc` needs only its C++ compiler. `check`: snmalloc's
# hardening checks. GTK and GStreamer allocate through glib's own malloc,
# so this covers the Rust side only.
snmalloc-rs = { version = "0.7.5", default-features = false, features = ["build_cc", "check"] }

# Internal crates
spoolframe-linux-core = { path = "crates/spoolframe-linux-core" }

# The client-facing media model. A path dependency until the permissive
# spoolframe crates are published to the coldsteel registry. Until then the
# nix build cannot see it: a subflake is copied to the store without its
# siblings, so spoolframe-linux has no nix package yet (see the root
# flake.nix).
spoolframe-types = { path = "../spoolframe/crates/spoolframe-types" }
# The client protocol's types (home screen, playback plans and handles,
# artwork sizes), which the SDK returns too. Same arrangement as above.
spoolframe-protocol = { path = "../spoolframe/crates/spoolframe-protocol" }
# The client side of the protocol: Iroh transport, saved servers, sessions.
spoolframe-client-sdk = { path = "../spoolframe/crates/spoolframe-client-sdk" }
# The SDK's Storage trait is an async-trait one.
async-trait = "0.1"

# UI: Relm4 over GTK 4 and libadwaita. v1_6 is the first libadwaita with
# the CSS colour variables and the system accent colour that theming is
# built on.
relm4 = { version = "0.11", features = ["libadwaita"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_6"] }
gtk = { package = "gtk4", version = "0.11", features = ["v4_16"] }
# v1_56: a font file added to the font map, for the wordmark's face.
pango = { version = "0.22", features = ["v1_56"] }

# Player: GstPlay drives playbin3. gtk4paintablesink is linked in rather
# than loaded as a system plugin, so that it uses the app's own GTK: a
# plugin built against another copy of GTK would load a second one.
gst = { package = "gstreamer", version = "0.25" }
# v1_26: tracks chosen by stream ID; the index calls fail under playbin3.
gst-play = { package = "gstreamer-play", version = "0.25", features = ["v1_26"] }
# The spoolframe:// source element is a BaseSrc subclass.
gst-base = { package = "gstreamer-base", version = "0.25" }
# dmabuf: decoded frames reach GTK in GPU memory; wayland/x11egl give
# the sink a GL context. Without them every frame is copied out of the
# decoder and converted on the CPU, which 4K cannot keep up with.
gst-plugin-gtk4 = { version = "0.15", features = ["gtk_v4_14", "dmabuf", "wayland", "x11egl"] }
# QR codes for a phone to scan (P3-05's sign-in with your phone); the
# encoder only, the app draws the modules itself.
qrcode = { version = "0.14", default-features = false }
# MPRIS on the session bus (P1-24): the desktop's Now Playing and media keys.
mpris-server = "0.10"
# A test's own directory under a random name, removed with it, so tests
# running at once never share one (core's `testing` feature).
spoolframe-test-dir = { path = "../spoolframe/crates/spoolframe-test-dir" }
# The play queue saved per profile (P1-23), as JSON beside the SDK's data.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Compiles the app's icons into its binary (a GResource).
glib-build-tools = "0.22"

# The backend's connection state is a tokio watch channel, as in the SDK.
# Relm4 runs its commands on tokio already. `macros`: join! for calls
# that do not wait on each other.
tokio = { version = "1", features = ["sync", "rt-multi-thread", "macros"] }

# Where config, data and cache live, by each platform's rules.
directories = "6"

# Secrets (the device key, session tokens) in the desktop's Secret
# Service, never a plain file.
oo7 = "0.6"

# Artwork kept on this device, in memory and on disk.
foyer = "0.22"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
thiserror = "2"
anyhow = "1"
