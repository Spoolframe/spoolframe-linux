# cargo audit (ci:audit, daily in .forgejo/workflows/audit.yaml): the
# advisories deny.toml accepts, with the reasons written there. Keep the
# two lists the same.
[advisories]
ignore = [
  # paste: unmaintained build-time proc-macro; none of it runs.
  "RUSTSEC-2024-0436",
]

[output]
# An unmaintained or yanked crate fails the audit too.
deny = ["warnings"]
quiet = false
