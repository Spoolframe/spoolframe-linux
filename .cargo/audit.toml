# cargo audit (ci:audit, daily in .forgejo/workflows/audit.yaml): the
# advisories deny.toml accepts, with the reasons written there. Keep the
# two lists the same.
[advisories]
ignore = [
  # paste: unmaintained build-time proc-macro; none of it runs.
  "RUSTSEC-2024-0436",
  # crypto-bigint 0.5 through elliptic-curve 0.13, from vendored
  # crypto-glue 0.1 (webauthn caBLE's ECDH): accepted until webauthn-rs
  # moves to crypto-glue 0.2.
  "RUSTSEC-2026-0387",
]

[output]
# An unmaintained or yanked crate fails the audit too.
deny = ["warnings"]
quiet = false
