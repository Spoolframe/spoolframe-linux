# Publishes the Flatpak bundle as GitHub release v<version>, where
# <version> is the workspace's (Cargo.toml), unless that release exists.
# Run by hand (Actions › Flatpak › Run workflow) on the GitHub mirror.
#
# The build is flatpak/README.md's, in Flathub's GNOME 51 image, which has
# flatpak-builder and the Flathub remote: the bundle needs the runtime from
# Flathub, and the build itself no network, as every crate is listed in
# cargo-sources.json.
name: Flatpak

on:
  workflow_dispatch:
    inputs:
      aarch64:
        description: Also build for aarch64 (arm runners are free only once the repo is public)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      published: ${{ steps.published.outputs.published }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7.0.1
      - id: version
        # The workspace version: the first `version` under [workspace.package].
        run: |
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)
          test -n "$version" || { echo "no version in Cargo.toml's [workspace.package]"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - id: published
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.version.outputs.version }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "$TAG is already published; nothing to do"
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - id: matrix
        # aarch64 only when asked: on a private repo an arm job would wait
        # for a runner it never gets.
        env:
          AARCH64: ${{ inputs.aarch64 }}
        run: |
          x86='{"arch":"x86_64","runner":"ubuntu-24.04","bundle":"spoolframe.flatpak"}'
          arm='{"arch":"aarch64","runner":"ubuntu-24.04-arm","bundle":"spoolframe-aarch64.flatpak"}'
          if [ "$AARCH64" = true ]; then include="[$x86,$arm]"; else include="[$x86]"; fi
          echo "matrix={\"include\":$include}" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    if: needs.version.outputs.published == 'false'
    strategy:
      fail-fast: true
      matrix: ${{ fromJSON(needs.version.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      # flatpak-builder needs to make namespaces for its sandbox.
      options: --privileged
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6.8
        with:
          manifest-path: flatpak/app.spoolframe.relm4.yml
          bundle: ${{ matrix.bundle }}
          arch: ${{ matrix.arch }}
          cache-key: flatpak-builder-${{ matrix.arch }}-${{ hashFiles('Cargo.lock', 'flatpak/*') }}
          # The runtime the bundle installs comes from Flathub.
          repository-url: https://dl.flathub.org/repo/flathub.flatpakrepo
          upload-artifact: true

  release:
    needs: [version, build]
    if: needs.version.outputs.published == 'false'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          path: bundles
          merge-multiple: true
      - name: Create release v${{ needs.version.outputs.version }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.version.outputs.version }}
        run: |
          ls -l bundles
          gh release create "$TAG" bundles/*.flatpak \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Spoolframe for Linux $TAG" \
            --notes "Install with: flatpak install --user spoolframe.flatpak (x86_64; spoolframe-aarch64.flatpak for aarch64, when built). The GNOME 51 runtime comes from Flathub."
