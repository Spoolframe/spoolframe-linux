name: CI

# Adapted from foundry's ci.yaml when the Linux client left the monorepo,
# in the job layout of Spoolframe/spoolframe-server's: lint, tests and the
# Nix build as three jobs that run at once. One project at the repo root,
# so there is no changed-project matrix.
on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

env:
  CI: "true"
  # devenv / cargo / nix draw progress bars when stdout looks like a TTY,
  # and the runner muddies that detection; flatten the output.
  TERM: dumb
  NO_COLOR: "1"

jobs:
  # Formatting, the license check and clippy: no tests.
  lint:
    name: "lint"
    runs-on: beefy
    steps:
      - uses: actions/checkout@v4
      # GitHub's API limit for Nix's github: inputs: a read-only GH_PAT
      # raises it from 60 to 5,000 requests an hour. Forgejo withholds
      # secrets from pull_request runs, and an empty token is worse than
      # none, so NIX_CONFIG is set only when the run has one.
      - name: GitHub token for Nix, when this run has one
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ -n "$GH_PAT" ]; then
            echo "NIX_CONFIG=access-tokens = github.com=$GH_PAT" >> "$GITHUB_ENV"
          fi

      - name: Tool versions
        run: |
          nix --version
          devenv --version

      # Each phase runs inside the ci profile's shell, so devenv's generated
      # files exist before a task reads them. Default step semantics stop at
      # the first failing phase. ci:style goes first: it is the cheap one.
      - name: ci:style
        shell: devenv --no-tui shell --profile ci -- bash -eo pipefail {0}
        run: devenv --no-tui tasks run --profile ci ci:style

      # ci:static runs spoolframe-linux:licenses first (cargo deny over the
      # client's graph, deny.toml) and spoolframe-linux:licenses-list (the
      # app's open source license list is current with Cargo.lock), then
      # clippy over every target.
      - name: ci:static
        shell: devenv --no-tui shell --profile ci -- bash -eo pipefail {0}
        run: devenv --no-tui tasks run --profile ci ci:static

      # kache (the coldsteel profile, devenv.nix) queues uploads in a daemon,
      # and the job's container may go before it drains them.
      - name: kache flush
        if: always()
        shell: devenv --no-tui shell --profile ci -- bash -eo pipefail {0}
        run: kache daemon stop || true

  # The whole suite in one run. The sandbox tests (tests/it/sandbox.rs) run
  # the app's `--self-check`, which confines itself with Landlock and
  # seccomp; the container gets the options foundry's check job ran these
  # tests under. No `image:`: the `beefy` label's default image still
  # applies.
  test:
    name: "test"
    runs-on: beefy
    container:
      options: --cap-add SYS_ADMIN --security-opt seccomp=unconfined
    steps:
      - uses: actions/checkout@v4
      # See the lint job.
      - name: GitHub token for Nix, when this run has one
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ -n "$GH_PAT" ]; then
            echo "NIX_CONFIG=access-tokens = github.com=$GH_PAT" >> "$GITHUB_ENV"
          fi

      - name: Tool versions
        run: |
          nix --version
          devenv --version

      # nextest under llvm-cov: JUnit at target/nextest/ci/junit.xml, lcov
      # at target/lcov.info. Tests that need a display, GStreamer's plugins
      # or a live server are #[ignore]d in the code.
      - name: ci:test
        shell: devenv --no-tui shell --profile ci -- bash -eo pipefail {0}
        run: devenv --no-tui tasks run --profile ci ci:test

      - name: kache flush
        if: always()
        shell: devenv --no-tui shell --profile ci -- bash -eo pipefail {0}
        run: kache daemon stop || true

      - name: Publish JUnit results
        if: always()
        uses: actions/action-junit-report@v4
        with:
          report_paths: target/nextest/ci/junit.xml
          check_name: tests
          fail_on_failure: true
          require_tests: false
          comment: true
          updateComment: true
          detailed_summary: true

      # Only when ci:test got as far as writing lcov: genhtml errors on no
      # input and would hide the real failure.
      - name: Setup lcov
        if: github.event_name == 'pull_request' && hashFiles('target/lcov.info') != ''
        shell: bash
        run: |
          set -euo pipefail
          LCOV_BIN=$(nix build --print-out-paths --no-link nixpkgs#lcov)/bin
          echo "$LCOV_BIN" >> "$GITHUB_PATH"
          "$LCOV_BIN/genhtml" --version | head -1

      - name: Coverage report
        if: github.event_name == 'pull_request' && hashFiles('target/lcov.info') != ''
        uses: actions/github-actions-report-lcov@v7.0.10
        with:
          coverage-files: target/lcov.info
          github-token: ${{ secrets.GITHUB_TOKEN }}
          update-comment: true

      # Pinned to v3 deliberately: v4's @actions/artifact v2 talks only to
      # GitHub.com's backend and aborts against Forgejo.
      - name: Upload coverage + test artifacts
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: tests
          path: |
            target/nextest/ci/junit.xml
            target/lcov.info
          if-no-files-found: ignore

  # Every flake output for x86_64-linux: the client package (crane, with the
  # SDK crates fetched from the Coldsteel registry) and the dev shell.
  nix:
    name: "nix"
    runs-on: beefy
    steps:
      - uses: actions/checkout@v4
      # See the lint job.
      - name: GitHub token for Nix, when this run has one
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ -n "$GH_PAT" ]; then
            echo "NIX_CONFIG=access-tokens = github.com=$GH_PAT" >> "$GITHUB_ENV"
          fi

      - name: Tool versions
        run: |
          nix --version
          om --version

      - name: om ci run
        run: om ci run --systems x86_64-linux .
